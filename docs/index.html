<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOL Прогноз</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f1f2f5; --card:#fff; --text:#14161a; --hint:#868c96; --accent:#2481cc;
  --line:#e6e8ec; --up:#16a34a; --down:#e5484d; --warn:#b7791f;
  --up-soft:rgba(22,163,74,.16); --down-soft:rgba(229,72,77,.16); --warn-soft:rgba(183,121,31,.12);
  --track:#eceef1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-scheme="light"]){
    --bg:#0e1116; --card:#181c23; --text:#eceef2; --hint:#8a919c; --accent:#5aa7e6;
    --line:#262b34; --up:#2fbf71; --down:#f0646a; --warn:#e0a33a;
    --up-soft:rgba(47,191,113,.2); --down-soft:rgba(240,100,106,.2); --warn-soft:rgba(224,163,58,.14);
    --track:#252a33; color-scheme:dark;
  }
}
:root[data-scheme="dark"]{
  --bg:#0e1116; --card:#181c23; --text:#eceef2; --hint:#8a919c; --accent:#5aa7e6;
  --line:#262b34; --up:#2fbf71; --down:#f0646a; --warn:#e0a33a;
  --up-soft:rgba(47,191,113,.2); --down-soft:rgba(240,100,106,.2); --warn-soft:rgba(224,163,58,.14);
  --track:#252a33; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--hint);margin:0 0 12px}
.hint{color:var(--hint);font-size:13px}
.up{color:var(--up)} .down{color:var(--down)}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.coin{font-size:13px;font-weight:600;color:var(--hint);letter-spacing:.03em}
.price{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.chg{font-size:14px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chg.up{background:var(--up-soft)} .chg.down{background:var(--down-soft)}
.spark{display:block;width:100%;height:56px;margin-top:10px}
.sparkmeta{display:flex;justify-content:space-between;margin-top:6px}

/* tabs */
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-top:12px;gap:4px}
.tabs button{flex:1;border:0;background:none;color:var(--hint);font:inherit;font-weight:600;font-size:14px;
  padding:8px 0;border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px;vertical-align:2px;background:currentColor;opacity:.85}

/* banner */
.banner{background:var(--warn-soft);color:var(--text);border-radius:14px;padding:12px 14px;margin-top:12px;
  display:flex;gap:10px;font-size:14px}
.banner b{color:var(--warn)}

/* main call */
.call{text-align:center}
.label{font-size:34px;font-weight:800;letter-spacing:.02em;line-height:1.1;margin-top:2px}
.label.none{color:var(--hint);font-size:28px}
.sub{margin-top:4px}
.gauge{display:block;width:100%;max-width:260px;margin:6px auto 0}
.gauge text{font-family:inherit;fill:var(--text)}
.gauge .t{fill:var(--hint);font-size:11px}
.meta{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;text-align:left}
.meta div:last-child{text-align:right}
.meta b{display:block;font-size:15px}
.liveline{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13px;text-align:left}
.liveline a{color:var(--accent);text-decoration:none;white-space:nowrap}

/* reasons */
.reason{display:grid;grid-template-columns:minmax(0,1fr) 20px 64px 46px;align-items:center;gap:8px;padding:7px 0}
.reason+.reason{border-top:1px solid var(--line)}
.rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scheme{font-size:11px;font-weight:700;color:var(--hint);border:1px solid var(--line);border-radius:6px;text-align:center;line-height:18px}
.bar{position:relative;height:8px;background:var(--track);border-radius:4px}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--hint);opacity:.5}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.push{text-align:right;font-size:13px;font-weight:600}

/* track record */
.stats{width:100%;border-collapse:collapse;font-size:14px}
.stats th{font-weight:500;color:var(--hint);font-size:12px;text-align:right;padding:0 0 6px}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats td{text-align:right;padding:8px 0;border-top:1px solid var(--line)}
.stats td b{font-size:16px}
.stats .bt td{color:var(--hint)}
.note{margin-top:10px}
.summary{display:flex;gap:14px;margin:16px 0 4px;font-size:13px;font-weight:600}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:minmax(0,1fr) 64px 48px 72px;align-items:center;gap:6px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.feed .when{line-height:1.2}
.feed .when small{display:block;color:var(--hint);font-size:12px}
.pill{font-size:12px;font-weight:700;padding:2px 0;border-radius:6px;text-align:center}
.pill.up{background:var(--up-soft)} .pill.down{background:var(--down-soft)} .pill.none{background:var(--track);color:var(--hint)}
.res{text-align:right;font-weight:600;font-size:13px;white-space:nowrap}
.res.flat,.res.pend{color:var(--hint)}

footer{text-align:center;margin:20px 8px 0}

/* states */
.state{text-align:center;padding:48px 20px}
.state .big{font-size:40px;line-height:1}
.state p{margin:12px 0 0}
.btn{margin-top:16px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:10px 22px;border-radius:12px;cursor:pointer}
.sk{background:var(--card);border-radius:18px;margin-top:12px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="sk" style="height:132px"></div>
  <div class="sk" style="height:44px"></div>
  <div class="sk" style="height:340px"></div>
  <p class="hint" style="text-align:center">Загружаем прогноз…</p>
</main>
<script>
const tg = window.Telegram && Telegram.WebApp;
const q = new URLSearchParams(location.search);
const SRC = q.get('src') || 'data.json', HIST = q.get('hist') || 'history.json';
const app = document.getElementById('app');
const HZ = {'1h':['1ч','1 час'],'4h':['4ч','4 часа'],'12h':['12ч','12 часов'],'1d':['1д','1 день'],'24h':['1д','1 день']};
let D = null, H = null, sel = null, timer = null;

function theme(){
  if (!tg || !tg.themeParams || !tg.themeParams.bg_color) return;
  const p = tg.themeParams, s = document.documentElement.style;
  document.documentElement.dataset.scheme = tg.colorScheme;
  const map = {'--bg': p.secondary_bg_color || p.bg_color, '--card': p.section_bg_color || p.bg_color,
    '--text': p.text_color, '--hint': p.hint_color || p.subtitle_text_color, '--accent': p.button_color || p.link_color};
  for (const k in map) if (map[k]) s.setProperty(k, map[k]);
  if (tg.setHeaderColor && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) tg.setHeaderColor('secondary_bg_color');
}
if (tg) { tg.ready(); tg.expand(); theme(); tg.onEvent && tg.onEvent('themeChanged', theme); }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok = x => typeof x === 'number' && isFinite(x);
const pct = (x, d = 0) => ok(x) ? (x * 100).toFixed(d) + '%' : '—';
const spct = (x, d = 1) => ok(x) ? (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x * 100).toFixed(d) + '%' : '—';
const usd = x => ok(x) ? '$' + x.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '—';
const dt = s => { const d = new Date(s); return isNaN(d) ? null : d; };
const fTime = d => d ? d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'}) : '—';
const fDay = d => d ? d.toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'}).replace('.', '') : '';
const hzShort = h => (HZ[h] || [h])[0], hzLong = h => (HZ[h] || [h, h])[1];
const callCls = c => c === 'UP' ? 'up' : c === 'DOWN' ? 'down' : 'none';

function ago(d){
  if (!d) return '—';
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return m + ' мин назад';
  const h = Math.floor(m / 60);
  return h < 48 ? h + ' ч назад' : Math.floor(h / 24) + ' дн назад';
}
function left(d){
  if (!d) return '—';
  let s = Math.floor((d - Date.now()) / 1000);
  if (s <= 0) return 'идёт проверка';
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); s %= 60;
  return h ? `${h} ч ${String(m).padStart(2, '0')} мин` : `${m} мин ${String(s).padStart(2, '0')} с`;
}

function spark(arr){
  const v = (arr || []).filter(ok);
  if (v.length < 2) return '<p class="hint">Нет данных для графика</p>';
  const W = 300, Hh = 56, min = Math.min(...v), max = Math.max(...v), r = max - min || 1;
  const pts = v.map((y, i) => [i / (v.length - 1) * W, 4 + (1 - (y - min) / r) * (Hh - 8)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const c = v[v.length - 1] >= v[0] ? 'var(--up)' : 'var(--down)';
  const ch = v[v.length - 1] / v[0] - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-label="График цены за 7 дней">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".22"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line}L${W} ${Hh}L0 ${Hh}Z" fill="url(#sg)"/>
    <path d="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="sparkmeta hint num"><span>7 дней · <span class="${ch >= 0 ? 'up' : 'down'}">${spct(ch)}</span></span><span>${usd(min)} – ${usd(max)}</span></div>`;
}

function gauge(p, thr, cls){
  const P = (v, r) => { const a = (-120 + 240 * v) * Math.PI / 180; return [100 + r * Math.sin(a), 100 - r * Math.cos(a)]; };
  const arc = (a, b, r = 80) => { const [x0, y0] = P(a, r), [x1, y1] = P(b, r);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${(b - a) * 240 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
  const col = cls === 'up' ? 'var(--up)' : cls === 'down' ? 'var(--down)' : 'var(--hint)';
  let s = `<path d="${arc(0, 1)}" stroke="var(--track)" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  if (ok(thr) && thr > .5 && thr < 1) {
    s += `<path d="${arc(0, 1 - thr)}" stroke="var(--down-soft)" stroke-width="14" fill="none"/>
          <path d="${arc(thr, 1)}" stroke="var(--up-soft)" stroke-width="14" fill="none"/>`;
    for (const v of [1 - thr, thr]) {
      const [x0, y0] = P(v, 69), [x1, y1] = P(v, 91), [tx, ty] = P(v, 104);
      s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--hint)" stroke-width="2"/>
            <text class="t" x="${tx}" y="${ty + 4}" text-anchor="middle">${pct(v)}</text>`;
    }
  }
  if (ok(p)) {
    const v = Math.min(1, Math.max(0, p));
    if (Math.abs(v - .5) > .002) s += `<path d="${arc(Math.min(v, .5), Math.max(v, .5))}" stroke="${col}" stroke-width="14" fill="none"/>`;
    const [kx, ky] = P(v, 80);
    s += `<circle cx="${kx}" cy="${ky}" r="9" fill="var(--card)" stroke="${col}" stroke-width="4"/>`;
  }
  const [lx, ly] = P(0, 80), [rx] = P(1, 80);
  s += `<text x="100" y="104" text-anchor="middle" font-size="38" font-weight="800">${pct(p)}</text>
        <text class="t" x="100" y="124" text-anchor="middle" font-size="12">вероятность роста</text>
        <text class="t" x="${lx}" y="${ly + 22}" text-anchor="middle">0%</text>
        <text class="t" x="${rx}" y="${ly + 22}" text-anchor="middle">100%</text>`;
  return `<svg class="gauge" viewBox="-12 -20 224 186" role="img" aria-label="Вероятность роста ${pct(p)}">${s}</svg>`;
}

function reasons(list){
  if (!list || !list.length) return '<p class="hint">Модель не выделила заметных факторов.</p>';
  const max = Math.max(.1, ...list.map(r => ok(r.push) ? Math.abs(r.push) : 0));
  return list.map(r => {
    const v = ok(r.push) ? r.push : 0, w = Math.abs(v) / max * 50, c = v >= 0 ? 'up' : 'down';
    return `<div class="reason"><span class="rname" title="${esc(r.name)}">${esc(r.name)}</span>
      <span class="scheme" title="Схема ${esc(r.scheme)}">${esc(r.scheme) || '·'}</span>
      <span class="bar"><i style="background:var(--${c});${v >= 0 ? 'left:50%' : 'right:50%'};width:${w}%"></i></span>
      <span class="push num ${ok(r.push) ? c : 'hint'}">${ok(r.push) ? spct(r.push, 0).replace('%', '') + ' пп' : '—'}</span></div>`;
  }).join('');
}

function nTxt(n){ return ok(n) ? `${n}${n > 0 && n < 30 ? ' · мало' : ''}` : '—'; }

function track(x){
  const L = x.live || {}, B = x.backtest || {};
  const row = (name, hit, cov, n, cls = '') => `<tr class="${cls}"><td>${name}</td><td class="num"><b>${pct(hit)}</b></td><td class="num">${pct(cov)}</td><td class="num">${nTxt(n)}</td></tr>`;
  return `<table class="stats"><thead><tr><th></th><th>Точность</th><th>Покрытие</th><th>Сигналов</th></tr></thead><tbody>
    ${row('Live 30 дн', L.hit30, L.cov30, L.n30)}
    ${row('Live 90 дн', L.hit90, L.cov90, L.n90)}
    ${row('Бэктест', B.hit, B.coverage, B.n, 'bt')}</tbody></table>
    <p class="hint note">Точность — доля верных среди выданных сигналов (монетка ≈ 50%). Покрытие — как часто модель вообще даёт сигнал. Live считается только по реальным прогнозам после запуска.</p>`;
}

function feed(h){
  if (!H) return '<p class="hint">История сейчас недоступна.</p>';
  const rows = H.filter(e => e && e.h === h).slice(-30).reverse();
  if (!rows.length) return '<p class="hint">Для этого горизонта ещё нет прогнозов.</p>';
  const cnt = {hit: 0, miss: 0, flat: 0, pend: 0};
  rows.forEach(e => cnt[e.result in cnt ? e.result : 'pend']++);
  const R = {hit: ['✓ верно', 'up'], miss: ['✕ мимо', 'down'], flat: ['– флэт', 'flat']};
  const li = rows.map(e => {
    const d = dt(e.t), [rt, rc] = R[e.result] || ['… ждём', 'pend'];
    const mv = ok(e.price) && ok(e.priceAfter) ? spct(e.priceAfter / e.price - 1) : '';
    const lbl = e.call === 'UP' ? '▲ Вверх' : e.call === 'DOWN' ? '▼ Вниз' : 'Нет';
    return `<li><span class="when num">${fDay(d)}, ${fTime(d)}<small>${usd(e.price)}${mv ? ' → ' + mv : ''}</small></span>
      <span class="pill ${callCls(e.call)}">${lbl}</span><span class="num hint">${pct(e.p_up)}</span>
      <span class="res ${rc}">${rt}</span></li>`;
  }).join('');
  return `<div class="summary num"><span class="up">✓ ${cnt.hit}</span><span class="down">✕ ${cnt.miss}</span><span class="hint">– ${cnt.flat}</span><span class="hint">… ${cnt.pend}</span><span class="hint" style="margin-left:auto;font-weight:400">последние ${rows.length}</span></div><ul class="feed">${li}</ul>`;
}

function render(){
  const keys = Object.keys(D.horizons || {});
  if (!keys.length) return fail('В данных нет ни одного горизонта.');
  if (!sel || !D.horizons[sel]) sel = D.horizons[D.main] ? D.main : keys[0];
  const x = D.horizons[sel], cls = callCls(x.call), up = new Date(D.updated);
  const stale = !isNaN(up) && Date.now() - up > 3 * 3600e3;
  const chk = dt(x.checkAt), L = x.live || {};
  const ev = D.event ? (typeof D.event === 'string' ? D.event : D.event.text || D.event.reason || D.event.title || D.event.name || '') : '';
  const label = {up: '▲ ВВЕРХ', down: '▼ ВНИЗ', none: 'НЕТ СИГНАЛА'}[cls];
  const sub = cls === 'none'
    ? (x.enabled === false ? 'На этом горизонте бэктест не нашёл надёжного сигнала, поэтому модель здесь молчит всегда.' : ev ? 'Модель на паузе из-за события на рынке.' : 'Вероятность не вышла за порог — модель воздерживается. Это нормально: так бывает чаще всего.')
    : `Модель считает ${cls === 'up' ? 'рост' : 'падение'} более вероятным на горизонте ${hzLong(sel)}. Это вероятность, не гарантия.`;

  app.innerHTML = `
  <section class="card">
    <div class="top"><div><div class="coin">SOL / USD</div><div class="price num">${usd(D.price)}</div></div>
      <span class="chg num ${ok(D.change24h) ? (D.change24h >= 0 ? 'up' : 'down') : 'hint'}">${spct(D.change24h)} за 24ч</span></div>
    ${spark(D.spark)}
  </section>
  <nav class="tabs" role="tablist">${keys.map(k => { const c = callCls(D.horizons[k].call);
    return `<button role="tab" data-h="${esc(k)}" aria-selected="${k === sel}">${esc(hzShort(k))}${c !== 'none' ? `<span class="dot ${k === sel ? '' : c}"></span>` : ''}</button>`; }).join('')}</nav>
  ${ev ? `<div class="banner" role="status"><span>⚠️</span><div><b>Сигналы приостановлены.</b> ${esc(ev)}</div></div>` : ''}
  <section class="card call">
    <div class="label ${cls}">${label}</div>
    <div class="hint sub">${sub}</div>
    ${gauge(x.p_up, x.threshold, cls)}
    <div class="meta"><div><span class="hint">Горизонт</span><b>${esc(hzLong(sel))}</b></div>
      <div><span class="hint">Проверка${chk ? ' в ' + fTime(chk) : ''}</span><b class="num" id="cd">${left(chk)}</b></div></div>
    <div class="liveline">Live за 30 дн: точность <b class="num">${pct(L.hit30)}</b> на ${ok(L.n30) ? L.n30 : '—'} сигналах · бэктест ${pct((x.backtest || {}).hit)} <a href="#track">трек-рекорд ↓</a></div>
  </section>
  <section class="card"><h2>Почему</h2>${reasons(x.reasons)}
    <p class="hint note">Сдвиг вероятности роста в процентных пунктах. Буква — схема признака.</p></section>
  <section class="card" id="track"><h2>Трек-рекорд · ${esc(hzShort(sel))}</h2>${track(x)}${feed(sel)}</section>
  <footer class="hint">Обновлено <span class="${stale ? 'down' : ''}">${ago(isNaN(up) ? null : up)}</span>${stale ? ' — данные могли устареть' : ''}<br><br>
    Не финансовый совет. Модель часто ошибается; смотрите трек-рекорд.</footer>`;

  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { sel = b.dataset.h; render(); });
  clearInterval(timer);
  timer = setInterval(() => { const el = document.getElementById('cd'); if (el) el.textContent = left(chk); }, 1000);
}

function fail(msg){
  clearInterval(timer);
  app.innerHTML = `<div class="card state"><div class="big">📡</div><p><b>Не удалось загрузить прогноз</b></p>
    <p class="hint">${esc(msg)}</p><button class="btn" id="retry">Повторить</button></div>
    <footer class="hint">Не финансовый совет. Модель часто ошибается; смотрите трек-рекорд.</footer>`;
  document.getElementById('retry').onclick = load;
}

async function getJSON(url){
  const r = await fetch(url, {cache: 'no-cache'});
  if (!r.ok) throw new Error(`Сервер ответил ${r.status} на ${url}`);
  return r.json();
}

async function load(){
  app.innerHTML = '<div class="sk" style="height:132px"></div><div class="sk" style="height:44px"></div><div class="sk" style="height:340px"></div><p class="hint" style="text-align:center">Загружаем прогноз…</p>';
  const [d, h] = await Promise.allSettled([getJSON(SRC), getJSON(HIST)]);
  if (d.status === 'rejected') return fail(navigator.onLine === false ? 'Нет подключения к интернету.' : d.reason.message || 'Ошибка сети.');
  D = d.value; H = h.status === 'fulfilled' && Array.isArray(h.value) ? h.value : null;
  try { render(); } catch (e) { fail('Данные в неожиданном формате.'); }
}
load();
</script>
