name: predict

on:
  schedule:
    - cron: "7 * * * *"   # every hour, a few minutes after the candle closes
  workflow_dispatch:

permissions:
  contents: write

concurrency: predict

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: python predict.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          APP_URL: ${{ vars.APP_URL }}
      - name: commit the new prediction
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs/data.json docs/history.json
          git diff --cached --quiet || (git commit -m "prediction $(date -u +%Y-%m-%dT%H)Z" && git push)
